<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 - Inteligência Comportamental</title>
    <style>
        :root {
            --nasa-blue: #0b1437;
            --neon-purple: #7c3aed;
            --deep-purple: #4c1d95;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --glow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--nasa-blue);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(76, 29, 149, 0.15) 0%, transparent 40%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        /* Mascote Formiga Liw */
        .liw-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .liw-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(124, 58, 237, 0.4));
        }

        /* Conteúdo */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        /* Botões Anatômicos */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 32px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--neon-purple);
            color: white;
            box-shadow: var(--glow);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: var(--deep-purple);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-white);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
            transform: translateY(-2px);
        }

        /* Rodapé */
        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: rgba(148, 163, 184, 0.5);
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            h1 { font-size: 1.75rem; }
            .description { font-size: 1rem; }
            .btn { padding: 18px 24px; font-size: 1rem; }
            .liw-container { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Mascote Formiga Liw Oficial -->
        <div class="liw-container">
            <svg class="liw-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Pernas (6 pernas de formiga) -->
                <path d="M60 110 L40 130 M60 120 L40 145 M140 110 L160 130 M140 120 L160 145" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round"/>
                
                <!-- Abdômen (Traseira) -->
                <ellipse cx="100" cy="145" rx="35" ry="25" fill="#4c1d95" />
                
                <!-- Tórax (Meio) com Camiseta -->
                <rect x="75" cy="105" width="50" height="40" rx="10" fill="#7c3aed" />
                <text x="100" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">LIW</text>
                
                <!-- Cabeça -->
                <circle cx="100" cy="80" r="35" fill="#7c3aed" />
                
                <!-- Olhos Grandes Castanhos -->
                <circle cx="85" cy="75" r="12" fill="white" />
                <circle cx="85" cy="75" r="7" fill="#5d4037" />
                <circle cx="115" cy="75" r="12" fill="white" />
                <circle cx="115" cy="75" r="7" fill="#5d4037" />
                
                <!-- Antenas -->
                <path d="M85 50 Q75 20 60 30" stroke="#7c3aed" stroke-width="3" fill="none" />
                <path d="M115 50 Q125 20 140 30" stroke="#7c3aed" stroke-width="3" fill="none" />
                <circle cx="60" cy="30" r="4" fill="#7c3aed" />
                <circle cx="140" cy="30" r="4" fill="#7c3aed" />
            </svg>
        </div>

        <h1>Psicotest26</h1>
        <p class="description">
            50 instrumentos comportamentais e profissionais com base científica para uso individual entre profissional e paciente.
        </p>

        <nav class="nav-menu">
            <a href="painel.html" class="btn btn-primary">
                Acessar Painel de Testes
            </a>
            <a href="admin.html" class="btn btn-secondary">
                Área do Administrador
            </a>
        </nav>

        <footer>
            &copy; 2024 Psicotest26 — Inteligência Comportamental
        </footer>
    </div>

    <script>
        // Pequena interação de entrada
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            container.style.transition = 'all 0.8s ease-out';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
