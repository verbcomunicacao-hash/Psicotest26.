<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 — Inteligência Comportamental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b1437;
            --accent-primary: #4f46e5;
            --accent-secondary: #7c3aed;
            --text-main: #ffffff;
            --text-dim: #a3b1cc;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .hero-container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 60px;
            align-items: center;
            padding: 40px 0;
        }

        .content-left {
            z-index: 2;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            color: var(--accent-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(to right, #fff, #a3b1cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.25rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 540px;
        }

        .button-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.5);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .visual-right {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            animation: float 6s ease-in-out infinite;
        }

        .liw-image {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.5));
            border-radius: var(--radius);
        }

        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 70%);
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 992px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 40px;
                padding: 60px 0;
            }

            .content-left {
                order: 2;
            }

            .visual-right {
                order: 1;
            }

            p.description {
                margin: 0 auto 40px;
            }

            .button-group {
                justify-content: center;
            }

            .btn {
                width: 100%;
                padding: 24px;
                font-size: 1.2rem;
            }

            .image-wrapper {
                max-width: 300px;
            }
        }

        /* Glassmorphism Card Background for the whole section on mobile */
        @media (max-width: 600px) {
            .hero-container {
                background: var(--glass);
                padding: 40px 20px;
                border-radius: var(--radius);
                border: 1px solid var(--glass-border);
                backdrop-filter: blur(20px);
            }
        }
    </style>
</head>
<body>

    <main class="hero-container">
        <section class="content-left">
            <div class="badge">Plataforma Profissional</div>
            <h1>Psicotest26 — Inteligência Comportamental</h1>
            <p class="description">
                50 instrumentos comportamentais e profissionais com base científica para uso individual entre profissional e paciente.
            </p>
            <div class="button-group">
                <a href="painel.html" class="btn btn-primary">Acessar Painel de Testes</a>
                <a href="admin.html" class="btn btn-secondary">Área do Administrador</a>
            </div>
        </section>

        <section class="visual-right">
            <div class="glow-effect"></div>
            <div class="image-wrapper">
                <img src="Generatedimage_1781123000215.png" alt="Mascote Liw" class="liw-image">
            </div>
        </section>
    </main>

</body>
</html>
