<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liw — Inteligência Comportamental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --nasa-blue: #0b1437;
            --liw-purple: #b14bff;
            --liw-purple-glow: rgba(177, 75, 255, 0.4);
            --text-white: #ffffff;
            --text-gray: #a3abbd;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--nasa-blue);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(177, 75, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 10% 80%, rgba(177, 75, 255, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
            gap: 60px;
        }

        /* Left Content */
        .hero-content {
            text-align: left;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            background: rgba(177, 75, 255, 0.1);
            border: 1px solid var(--liw-purple);
            color: var(--liw-purple);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(to right, #fff, #d9a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.25rem;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 540px;
        }

        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 400px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--liw-purple);
            color: white;
            box-shadow: 0 10px 30px rgba(177, 75, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(177, 75, 255, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--liw-purple);
        }

        /* Right Content - Image */
        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            animation: float 6s ease-in-out infinite;
        }

        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: var(--liw-purple);
            filter: blur(100px);
            opacity: 0.4;
            z-index: -1;
            border-radius: 50%;
        }

        .liw-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Mobile Responsive */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 20px;
            }

            .hero-content {
                order: 2;
                text-align: center;
            }

            .hero-visual {
                order: 1;
                margin-bottom: 20px;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .cta-group {
                margin: 0 auto;
                width: 100%;
            }

            h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .btn {
                width: 100%;
            }
            .image-wrapper {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <section class="hero-content">
            <div class="badge">Plataforma Profissional</div>
            <h1>Formiga Liw</h1>
            <p class="description">
                Acesse 50 instrumentos comportamentais e profissionais com base científica para transformar sua carreira e autoconhecimento.
            </p>
            
            <div class="cta-group">
                <a href="painel.html" class="btn btn-primary">
                    Acessar Painel de Testes
                </a>
                <a href="admin.html" class="btn btn-secondary">
                    Área do Administrador
                </a>
            </div>
        </section>

        <section class="hero-visual">
            <div class="image-wrapper">
                <div class="glow-effect"></div>
                <img src="Generatedimage_1781123000215.png" alt="Formiga Liw Original" class="liw-img">
            </div>
        </section>
    </main>

</body>
</html>
