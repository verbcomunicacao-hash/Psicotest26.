<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Psicotest26 | Liw</title><script src="https://cdn.tailwindcss.com"></script><style>@keyframes float {0%, 100% {transform: translateY(0);}50% {transform: translateY(-15px);}}@keyframes jump {0%, 100% {transform: translateY(0);}50% {transform: translateY(-40px);}}.animate-float {animation: float 3s ease-in-out infinite;}.animate-jump {animation: jump 0.5s ease-in-out;}.rounded-4xl {border-radius: 48px;}</style></head><body class="bg-[#f8fafc] min-h-screen flex flex-col items-center justify-center p-6 font-sans"><div id="app" class="w-full max-w-md text-center"><div id="home-screen"><div class="relative inline-block mb-8"><div class="w-40 h-40 bg-white rounded-full shadow-xl flex items-center justify-center animate-float cursor-pointer overflow-hidden" onclick="this.classList.add('animate-jump'); setTimeout(() => this.classList.remove('animate-jump'), 500)"><img src="https://generated-images.adapta.one/verbcomunicacao%40gmail.com/019ead7e-c833-74de-8776-7bf8231e0b2b/2026-06-10T19-55-17-965Z_A_high_quality_3D_character_design_of_a_friendly_a.png" alt="Liw" class="w-full h-full object-cover"></div></div><h1 class="text-4xl font-bold text-gray-800 mb-4">Psicotest26</h1><p class="text-lg text-gray-600 mb-8">Oi eu sou o Liw, que bom te ver por aqui, vamos crescer juntos!</p><button onclick="startTest()" class="w-full bg-[#6366f1] text-white py-4 rounded-4xl font-bold text-lg hover:bg-indigo-600 transition-all">Começar Agora</button></div><div id="test-screen" class="hidden"><div class="w-full bg-gray-200 rounded-full h-2.5 mb-6"><div id="progress-bar" class="bg-[#6366f1] h-2.5 rounded-full" style="width: 0%"></div></div><h2 id="question" class="text-2xl font-semibold mb-6">Carregando...</h2><div id="options" class="space-y-4"></div></div><div id="dashboard-screen" class="hidden"><h2 class="text-3xl font-bold mb-6">Dashboard EU/Adapta</h2><div class="bg-white p-8 rounded-4xl shadow-sm border border-gray-100"><p class="text-gray-600">Seu perfil cerebral foi mapeado com sucesso!</p><div class="mt-6 grid grid-cols-2 gap-4"><div class="bg-indigo-50 p-4 rounded-2xl"><p class="text-sm text-indigo-600">Analítico</p><p class="text-xl font-bold">85%</p></div><div class="bg-indigo-50 p-4 rounded-2xl"><p class="text-sm text-indigo-600">Criativo</p><p class="text-xl font-bold">65%</p></div></div></div></div></div><script>const questions = [{q: "Como você prefere resolver problemas?", options: ["Lógica pura", "Intuição"]}, {q: "Em grupo, você prefere:", options: ["Liderar", "Colaborar"]}]; let currentStep = 0; function startTest() { document.getElementById('home-screen').classList.add('hidden'); document.getElementById('test-screen').classList.remove('hidden'); showQuestion(); } function showQuestion() { if (currentStep >= questions.length) return showDashboard(); const q = questions[currentStep]; document.getElementById('question').innerText = q.q; const optionsDiv = document.getElementById('options'); optionsDiv.innerHTML = ''; q.options.forEach(opt => { const btn = document.createElement('button'); btn.className = 'w-full border-2 border-gray-200 py-4 rounded-4xl hover:border-[#6366f1] transition-all'; btn.innerText = opt; btn.onclick = () => { currentStep++; document.getElementById('progress-bar').style.width = (currentStep/questions.length)*100 + '%'; showQuestion(); }; optionsDiv.appendChild(btn); }); } function showDashboard() { document.getElementById('test-screen').classList.add('hidden'); document.getElementById('dashboard-screen').classList.remove('hidden'); }</script></body></html>
