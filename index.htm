<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 | Liw AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .liw-container { position: relative; height: 280px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -40px; }
        .liw-img { width: 240px; z-index: 10; filter: drop-shadow(0 20px 30px rgba(99, 102, 241, 0.2)); }
        .app-title { position: relative; z-index: 20; margin-top: -20px; text-shadow: 0 4px 10px rgba(255,255,255,0.8); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .float { animation: float 4s ease-in-out infinite; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- TELA DE ABERTURA PREMIUM -->
    <div id="home-view" class="bg-white w-full max-w-md rounded-[48px] shadow-2xl p-10 text-center flex flex-col items-center border border-gray-100">
        <div class="bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-[10px] font-black mb-6 tracking-widest uppercase">
            ✨ COM O LIW INTEGRADO
        </div>
        
        <p class="text-slate-800 font-bold italic text-lg mb-4 leading-tight px-4">
            "Oi, eu sou o Liw, que bom te ver por aqui, vamos crescer juntos!"
        </p>

        <!-- O LIW ATRÁS DO NOME -->
        <div class="liw-container float">
            <img src="https://generated-images.adapta.one/verbcomunicacao%40gmail.com/019ead7e-c833-74de-8776-7bf8231e0b2b/2026-06-10T19-55-17-965Z_A_high_quality_3D_character_design_of_a_friendly_a.png" 
                 alt="Liw" class="liw-img">
        </div>

        <h1 class="app-title text-5xl font-black text-slate-900 tracking-tighter">Psicotest26</h1>
        <p class="text-slate-400 text-sm mt-4 mb-10 leading-relaxed">Sua jornada de autoconhecimento<br>começa agora.</p>
        
        <button onclick="showTests()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-5 rounded-3xl transition-all shadow-xl shadow-indigo-100 active:scale-95 text-lg">
            Começar Agora
        </button>
    </div>

    <!-- MENU DE TESTES -->
    <div id="tests-view" class="hidden-view w-full max-w-md">
        <div class="bg-white rounded-[48px] shadow-2xl p-10 border border-gray-100 text-center">
            <h2 class="text-2xl font-black text-slate-800 mb-2">Escolha seu teste</h2>
            <p class="text-slate-400 text-xs mb-10">O Liw preparou o terreno para você.</p>
            
            <div class="grid gap-5">
                <div class="group bg-slate-50 p-6 rounded-3xl border-2 border-transparent hover:border-indigo-600 hover:bg-white transition-all cursor-pointer flex justify-between items-center shadow-sm">
                    <div class="text-left">
                        <div class="font-bold text-slate-800">Predominância Cerebral</div>
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Neurociência</div>
                    </div>
                    <span class="text-green-500 font-black text-[9px] bg-green-50 px-2 py-1 rounded-lg">INCLUÍDO</span>
                </div>
            </div>
            
            <button onclick="location.reload()" class="mt-10 text-slate-300 font-bold text-xs hover:text-indigo-600 w-full transition-colors uppercase tracking-widest">Voltar ao início</button>
        </div>
    </div>

    <script>
        function showTests() {
            document.getElementById('home-view').classList.add('hidden-view');
            document.getElementById('tests-view').classList.remove('hidden-view');
        }
    </script>
</body>
</html>
