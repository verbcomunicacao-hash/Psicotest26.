<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 | Liw AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .float-animation { animation: float 3s ease-in-out infinite; }
        .hidden-view { display: none; }
        .speech-bubble {
            position: relative;
            background: #1e293b;
            color: white;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 240px;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #1e293b;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- TELA INICIAL -->
    <div id="home-view" class="bg-white w-full max-w-md rounded-[40px] shadow-2xl p-10 text-center flex flex-col items-center border border-gray-100">
        <div class="bg-indigo-50 text-indigo-600 px-4 py-1 rounded-full text-[10px] font-bold mb-8 tracking-widest uppercase">
            ✨ COM O LIW INTEGRADO
        </div>
        
        <div class="speech-bubble">
            <p class="text-sm font-medium italic">Oie, você tava sumida né, bem-vinda de volta!</p>
        </div>

        <!-- LIW (FORMIGUINHA ROXA 3D) -->
        <div class="float-animation mb-10">
            <div class="relative w-32 h-32 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg border-4 border-white">
                <span class="text-7xl">🐜</span>
                <div class="absolute -top-1 -right-1 bg-white rounded-full p-2 shadow-md text-xl">👋</div>
            </div>
        </div>

        <h1 class="text-4xl font-black text-gray-800 mb-4 tracking-tighter">Psicotest26</h1>
        <p class="text-gray-400 text-sm mb-10 leading-relaxed">Avaliações inteligentes com o seu<br>companheiro de jornada.</p>
        
        <button onclick="showTests()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-5 rounded-3xl transition-all shadow-xl shadow-indigo-200 active:scale-95 text-lg">
            Começar Agora
        </button>
    </div>

    <!-- MENU DE TESTES -->
    <div id="tests-view" class="hidden-view w-full max-w-md">
        <div class="bg-white rounded-[40px] shadow-2xl p-10 border border-gray-100 text-center">
            <h2 class="text-2xl font-black text-gray-800 mb-2">Escolha seu teste</h2>
            <p class="text-gray-400 text-xs mb-10">O Liw preparou o terreno para você.</p>
            
            <div class="grid gap-5">
                <div class="group bg-gray-50 p-6 rounded-3xl border-2 border-transparent hover:border-indigo-600 hover:bg-white transition-all cursor-pointer flex justify-between items-center shadow-sm">
                    <div class="text-left">
                        <div class="font-bold text-gray-800">Predominância Cerebral</div>
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Neurociência</div>
                    </div>
                    <span class="text-green-500 font-black text-[9px] bg-green-50 px-2 py-1 rounded-lg">INCLUÍDO</span>
                </div>
            </div>
            
            <button onclick="location.reload()" class="mt-10 text-gray-300 font-bold text-xs hover:text-indigo-600 w-full transition-colors uppercase tracking-widest">Voltar ao início</button>
        </div>
    </div>

    <script>
        function showTests() {
            document.getElementById('home-view').classList.add('hidden-view');
            document.getElementById('tests-view').classList.remove('hidden-view');
        }
    </script>
</body>
</html>
