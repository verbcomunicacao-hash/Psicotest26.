ara desbloquear o potencial da sua mente.</p></div></main><script>const ctx = document.getElementById('resultChart').getContext('2d'); new Chart(ctx, { type: 'pie', data: { labels: ['Analítico', 'Criativo', 'Relacional', 'Executivo'], datasets: [{ data: [25, 25, 25, 25], backgroundColor: ['#4f46e5', '#ec4899', '#f59e0b', '#10b981'] }] }, options: { responsive: true } });</script></body></html>
