<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 - Bem-vindo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 50px; color: #2c3e50; }
        .card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 450px; margin: auto; border: 1px solid #e1e8ed; }
        h1 { color: #1a2a3a; font-size: 28px; margin-bottom: 10px; }
        .character { font-size: 64px; margin: 20px 0; display: block; }
        .quote { font-style: italic; color: #7f8c8d; margin: 20px 0; line-height: 1.6; }
        .btn { background: #27ae60; color: white; padding: 18px 35px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); background: #219150; }
        .footer { margin-top: 40px; color: #95a5a6; font-size: 13px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="character">🐜</span>
        <h1>Olá, eu sou o Ínu!</h1>
        <p>Bem-vindo ao <strong>Psicotest26</strong>. Eu e o Vínu vamos te acompanhar nessa jornada de autoconhecimento.</p>
        <p class="quote">"O conhecimento da mente humana é a chave para a verdadeira liberdade. Vamos mapear o invisível?"</p>
        <br>
        <a href="#" class="btn">Começar Avaliação</a>
    </div>
    <div class="footer">
        GESTÃO INTELIGENTE | POWERED BY LIW IA
    </div>
</body>
</html>
