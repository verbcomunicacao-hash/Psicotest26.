iv></div><div id="view-dashboard" class="hidden w-full max-w-4xl"><h2 class="text-3xl font-bold mb-8">Dashboard EU/Adapta</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div class="bg-white p-8 rounded-[48px] shadow-soft">Analítico</div><div class="bg-white p-8 rounded-[48px] shadow-soft">Criativo</div><div class="bg-white p-8 rounded-[48px] shadow-soft">Executivo</div></div></div></div><script>function startTest(){document.getElementById('view-home').classList.add('hidden');document.getElementById('view-test').classList.remove('hidden');renderQuestion();}function renderQuestion(){const options = ['Lógica', 'Criatividade', 'Planejamento'];const container = document.getElementById('options');container.innerHTML = options.map(opt => `<button onclick="showDashboard()" class="w-full p-4 border-2 border-slate-100 rounded-[48px] hover:border-[#6366f1] transition-all">${opt}</button>`).join('');}function showDashboard(){document.getElementById('view-test').classList.add('hidden');document.getElementById('view-dashboard').classList.remove('hidden');}</script></body></html>
