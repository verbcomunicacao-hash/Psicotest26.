<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicotest26 - Inteligência Comportamental</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { padding: 2rem; text-align: center; background: white; border-bottom: 1px solid #e2e8f0; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        h1 { color: var(--primary); margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        #fb-login-btn { background-color: #1877f2; color: white; padding: 14px 28px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: transform 0.2s; width: 100%; margin-top: 1.5rem; }
        #fb-login-btn:hover { transform: scale(1.02); background-color: #166fe5; }
        footer { padding: 1.5rem; text-align: center; font-size: 0.8rem; color: #64748b; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <header>
        <h1>Psicotest26</h1>
        <p>A maior plataforma de testes comportamentais do mercado</p>
    </header>
    <main>
        <div class="login-card">
            <h2>Bem-vindo ao Liw Mind</h2>
            <p>Acesse para iniciar sua jornada de autoconhecimento</p>
            <button id="fb-login-btn" onclick="loginComFacebook()">Entrar com Facebook</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Psicotest26. Este material é para fins de autoconhecimento e não substitui diagnóstico clínico profissional.</p>
    </footer>

    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : 'INSIRA_SEU_APP_ID_AQUI', // Wilson, cole o número do Facebook aqui
                cookie     : true,
                xfbml      : true,
                version    : 'v18.0'
            });
        };

        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/pt_BR/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));

        function loginComFacebook() {
            FB.login(function(response) {
                if (response.authResponse) {
                    FB.api('/me', {fields: 'name, email'}, function(userData) {
                        alert('Olá, ' + userData.name + '! O Liw Mind já está carregando seus testes.');
                        // Aqui o sistema redireciona para a página de testes
                        window.location.href = 'testes.html'; 
                    });
                } else {
                    console.log('Login cancelado ou não autorizado.');
                }
            }, {scope: 'public_profile,email'});
        }
    </script>
</body>
</html>
