<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psicotest26 | Catálogo de Testes</title>
  <style>
    body{font-family:'Segoe UI',sans-serif;background-color:#f3e5f5;margin:0;padding:0}
    header{background:linear-gradient(to right,#6a1b9a,#9c27b0);color:white;padding:20px;display:flex;align-items:center;gap:20px}
    header a{color:white;text-decoration:none;font-weight:bold}
    main{max-width:1200px;margin:20px auto;padding:0 20px}
    .controls{margin-bottom:20px}
    .search-bar{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:8px}
    .filter-btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
    button{padding:8px 15px;border:none;border-radius:20px;cursor:pointer;background:#fff;border:1px solid #9c27b0;color:#9c27b0}
    button.active{background:#9c27b0;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:0.8em;color:#fff;margin-bottom:10px}
    .card h3{margin:10px 0;font-size:0.95rem}
    .card p{font-size:0.85em;color:#666}
    @media(max-width:992px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div><a href="index.htm">← Voltar</a></div>
    <h1>🐜 Psicotest26 | Liw Mind</h1>
  </header>
  <main>
    <h2>📋 Catálogo de Testes</h2>
    <p>50 testes comportamentais e psicológicos disponíveis</p>
    <div class="controls">
      <input type="text" id="search" class="search-bar" placeholder="Buscar por título...">
      <div class="filter-btns" id="filters"></div>
    </div>
    <div class="grid" id="test-grid"></div>
  </main>
  <script>
    const colors = {
      Comportamental:"#2196f3", Psicológico:"#9c27b0", Personalidade:"#4caf50",
      Cognitivo:"#ff9800", Social:"#e91e63", Negócios:"#f44336", Saúde:"#b71c1c",
      Filosófico:"#3f51b5", Liderança:"#00bcd4", Carreira:"#009688",
      "Soft Skills":"#ffeb3b", Gestão:"#9e9e9e", Relacional:"#e91e63",
      Comercial:"#795548", Neuropsicológico:"#4a148c", Inovação:"#cddc39",
      Produtividade:"#8bc34a"
    };
    let tests = [];
    const grid = document.getElementById('test-grid');
    const search = document.getElementById('search');
    const filters = document.getElementById('filters');

    async function loadTests() {
      const res = await fetch('testes.json');
      tests = await res.json();
      renderFilters();
      renderTests(tests);
    }

    function renderFilters() {
      const tipos = ["Todos", ...new Set(tests.map(t => t.tipo))];
      tipos.forEach(t => {
        const btn = document.createElement('button');
        btn.innerText = t;
        btn.onclick = () => filtrar(t, btn);
        filters.appendChild(btn);
      });
    }

    function renderTests(data) {
      grid.innerHTML = '';
      data.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="badge" style="background:${colors[t.tipo] || '#000'}">${t.tipo}</span>
          <h3>${t.titulo}</h3>
          <p>📝 ${t.perguntas} perguntas</p>
          ${t.bibliografia ? `<p>📖 ${t.bibliografia}</p>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function filtrar(tipo, btn) {
      document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const filtrados = tipo === 'Todos' ? tests : tests.filter(t => t.tipo === tipo);
      renderTests(filtrados);
    }

    search.oninput = (e) => {
      const val = e.target.value.toLowerCase();
      renderTests(tests.filter(t => t.titulo.toLowerCase().includes(val)));
    };

    loadTests();
  </script>
</body>
</html>
