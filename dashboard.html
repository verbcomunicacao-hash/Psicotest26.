<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Liw — Autoconhecimento Premium</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --roxo-neon: #b14bff;
            --roxo-claro: #d9a6ff;
            --roxo-escuro: #6a2bcf;
            --fundo: #0a0514;
            --fundo-card: rgba(26, 17, 48, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --texto: #f0e6ff;
            --texto-suave: #b9a8d6;
            --premium: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: var(--fundo);
            color: var(--texto);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(177, 75, 255, 0.15), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(106, 43, 207, 0.2), transparent 40%);
            overflow-x: hidden;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center;
            padding: 40px 0;
            animation: fadeIn 1s ease;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #fff, var(--roxo-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* Grid de Testes */
        .grid-testes {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card-teste {
            background: var(--fundo-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(177, 75, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .card-teste:hover {
            transform: scale(1.02);
            border-color: var(--roxo-neon);
            box-shadow: 0 10px 30px rgba(177, 75, 255, 0.15);
        }

        .card-teste.premium {
            border-color: rgba(255, 215, 0, 0.3);
            opacity: 0.85;
        }

        .info-teste h3 {
            color: var(--roxo-claro);
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .info-teste p {
            font-size: 0.85rem;
            color: var(--texto-suave);
        }

        .status-icon { font-size: 1.2rem; }

        /* Motor de Teste */
        #tela-teste, #tela-resultado { display: none; }

        .pergunta-box {
            background: var(--fundo-card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--roxo-neon);
            margin-top: 20px;
        }

        .opcao-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--glass);
            border: 1px solid rgba(177, 75, 255, 0.3);
            border-radius: 12px;
            color: white;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcao-btn:hover { background: rgba(177, 75, 255, 0.2); border-color: var(--roxo-neon); }

        /* Mascote Formiga Liw */
        .liw-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .liw-balao {
            background: white;
            color: #1a1130;
            padding: 12px 18px;
            border-radius: 15px 15px 0 15px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            max-width: 200px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
        }

        .formiga-liw {
            width: 80px;
            height: 80px;
            cursor: pointer;
            filter: drop-shadow(0 0 10px var(--roxo-neon));
        }

        /* Modal Wilson */
        .modal-wilson {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--fundo-card);
            border: 2px solid var(--roxo-neon);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            animation: zoomIn 0.3s ease;
        }

        .modal-content h2 { color: var(--roxo-neon); margin-bottom: 20px; }

        .btn-premium {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .progresso-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progresso-fill {
            height: 100%;
            background: var(--roxo-neon);
            width: 0%;
            transition: 0.3s;
        }

        .devolutiva-ouro {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #e0d5ff;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA 1: LISTA -->
    <section id="tela-lista">
        <header>
            <h1>✦ Universo Liw ✦</h1>
            <p>50 Testes de Elite para sua Evolução</p>
        </header>
        <div id="grid-testes" class="grid-testes"></div>
    </section>

    <!-- TELA 2: TESTE -->
    <section id="tela-teste">
        <div class="pergunta-box">
            <div id="teste-info-topo" style="display:flex; justify-content: space-between; color: var(--roxo-claro); font-weight: bold;"></div>
            <div class="progresso-bar"><div id="progresso-fill" class="progresso-fill"></div></div>
            <h2 id="pergunta-texto" style="margin: 20px 0;"></h2>
            <div id="opcoes-container"></div>
        </div>
    </section>

    <!-- TELA 3: RESULTADO -->
    <section id="tela-resultado">
        <div class="pergunta-box" style="text-align: center;">
            <h1 id="res-titulo" style="color: var(--roxo-neon);"></h1>
            <div id="res-conteudo" class="devolutiva-ouro" style="margin: 30px 0; text-align: left;"></div>
            <button onclick="location.reload()" class="opcao-btn" style="text-align: center; background: var(--roxo-escuro);">Voltar ao Início</button>
        </div>
    </section>
</div>

<!-- MASCOTE FORMIGA LIW -->
<div class="liw-container">
    <div id="liw-balao" class="liw-balao"></div>
    <svg class="formiga-liw" viewBox="0 0 100 100" onclick="falarLiw()">
        <!-- Corpo Formiga -->
        <ellipse cx="50" cy="75" rx="15" ry="12" fill="#6a2bcf" />
        <ellipse cx="50" cy="55" rx="12" ry="10" fill="#b14bff" />
        <ellipse cx="50" cy="35" rx="14" ry="14" fill="#b14bff" />
        <!-- Camiseta -->
        <path d="M38 35 Q50 25 62 35 L60 50 Q50 55 40 50 Z" fill="#6a2bcf" />
        <text x="50" y="45" font-size="6" fill="white" text-anchor="middle" font-weight="bold">Liw</text>
        <!-- Olhos Grandes Castanhos -->
        <circle cx="43" cy="32" r="4" fill="#5d3a1a" />
        <circle cx="57" cy="32" r="4" fill="#5d3a1a" />
        <circle cx="44" cy="31" r="1.5" fill="white" />
        <circle cx="58" cy="31" r="1.5" fill="white" />
        <!-- Antenas -->
        <path d="M45 22 Q40 10 35 15" stroke="#b14bff" fill="none" stroke-width="2" />
        <path d="M55 22 Q60 10 65 15" stroke="#b14bff" fill="none" stroke-width="2" />
    </svg>
</div>

<!-- MODAL WILSON (7/7) -->
<div id="modal-wilson" class="modal-wilson">
    <div class="modal-content">
        <h2 id="wilson-titulo">Wilson diz:</h2>
        <p id="wilson-frase" style="font-style: italic; font-size: 1.2rem; line-height: 1.6;"></p>
        <button onclick="fecharWilson()" class="opcao-btn" style="text-align: center; margin-top: 30px;">Continuar Jornada →</button>
    </div>
</div>

<script>
// CONFIGURAÇÃO FIREBASE (Substitua pelas suas chaves reais)
const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "seu-projeto.firebaseapp.com",
    projectId: "seu-projeto",
    storageBucket: "seu-projeto.appspot.com",
    messagingSenderId: "...",
    appId: "..."
};
firebase.initializeApp(firebaseConfig);

// 15 FRASES REAIS DO WILSON
const FRASES_WILSON = [
    "Você já respondeu 7 perguntas! Sabe o que isso significa? Que você é mais persistente do que 90% das pessoas que desistem no início. Continua!",
    "Mais 7! Se o autoconhecimento fosse um esporte, você já estaria com a medalha brilhando. Não para agora!",
    "7 perguntas a mais e você nem suou. Esse esforço é o que separa quem evolui de quem só finge. Vamo!",
    "Parabéns por mais 7! Sabe quem também não desiste? O personagem de filme que todo mundo admira. Hoje esse personagem é você.",
    "7 perguntas respondidas e zero desistência. Estou começando a achar que você é imbatível. Prove que estou certo!",
    "Você passou de mais 7 perguntas! Se cada resposta fosse um degrau, você já estaria vendo a vista lá de cima.",
    "Outras 7 conquistadas! Repara: ninguém ficou aqui respondendo por você. Essa coragem é toda sua.",
    "7 perguntas e o Liw aqui já está orgulhoso. E olha que ele é uma formiga exigente. Não me decepcione!",
    "Mais 7 feitas! Se autoconhecimento desse em Real, você já teria pago o almoço. O pagamento aqui é clareza mental.",
    "7 perguntas vencidas! Desistir agora seria como largar a colher a uma colherada do fim do sorvete. Ninguém faz isso!",
    "Outras 7 respondidas! Você está no modo 'não tem pra ninguém'. Mantenha essa energia, o final vale a pena.",
    "7 perguntas e a pressão tá subindo? Ótimo. Pressão vira diamante, lembra? Você está brilhando.",
    "Mais 7! Cada resposta sua é um espelho novo. E você tem coragem de se olhar em todos eles. Isso é raro.",
    "7 perguntas respondidas e o relógio nem te assustou. Foco de quem leva a sério o próprio crescimento.",
    "Outras 7 vencidas! Você desbloqueou o modo 'Pessoa que se conhece de verdade'. Spoiler: é o melhor modo do jogo!"
];

// ESTADO GLOBAL
let todosTestes = [];
let testeAtual = null;
let indicePergunta = 0;
let contadorWilson = 0;
let respostasUsuario = [];

// CARREGAR DADOS
async function carregarPainel() {
    try {
        const response = await fetch('testes.json');
        const data = await response.json();
        todosTestes = data.testes || data;
        renderizarLista();
    } catch (e) {
        console.error("Erro ao carregar testes:", e);
        document.getElementById('grid-testes').innerHTML = "<p>Erro ao carregar banco de dados.</p>";
    }
}

function renderizarLista() {
    const grid = document.getElementById('grid-testes');
    grid.innerHTML = '';

    todosTestes.forEach((teste, index) => {
        const isPremium = index >= 26;
        const card = document.createElement('div');
        card.className = `card-teste ${isPremium ? 'premium' : ''}`;
        card.onclick = () => isPremium ? mostrarAvisoPremium() : iniciarTeste(index);

        card.innerHTML = `
            <div class="info-teste">
                <h3>${teste.titulo}</h3>
                <p>${teste.perguntas.length} perguntas • ${teste.categoria || 'Geral'}</p>
            </div>
            <div class="status-icon">
                ${isPremium ? '🔒' : '🔓'}
            </div>
        `;
        grid.appendChild(card);
    });
}

function iniciarTeste(index) {
    testeAtual = todosTestes[index];
    indicePergunta = 0;
    contadorWilson = 0;
    respostasUsuario = [];
    
    document.getElementById('tela-lista').style.display = 'none';
    document.getElementById('tela-teste').style.display = 'block';
    
    renderizarPergunta();
}

function renderizarPergunta() {
    const p = testeAtual.perguntas[indicePergunta];
    const total = testeAtual.perguntas.length;
    
    document.getElementById('teste-info-topo').innerText = `${testeAtual.titulo} (${indicePergunta + 1}/${total})`;
    document.getElementById('progresso-fill').style.width = `${((indicePergunta) / total) * 100}%`;
    document.getElementById('pergunta-texto').innerText = p.texto;
    
    const container = document.getElementById('opcoes-container');
    container.innerHTML = '';
    
    p.opcoes.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opcao-btn';
        btn.innerText = opt.texto || opt;
        btn.onclick = () => processarResposta(opt.valor || i);
        container.appendChild(btn);
    });
}

function processarResposta(valor) {
    respostasUsuario.push(valor);
    indicePergunta++;
    contadorWilson++;

    if (contadorWilson === 7 && indicePergunta < testeAtual.perguntas.length) {
        mostrarWilson();
        return;
    }

    if (indicePergunta >= testeAtual.perguntas.length) {
        finalizarTeste();
    } else {
        renderizarPergunta();
    }
}

function mostrarWilson() {
    const frase = FRASES_WILSON[Math.floor(Math.random() * FRASES_WILSON.length)];
    document.getElementById('wilson-frase').innerText = `"${frase}"`;
    document.getElementById('modal-wilson').style.display = 'flex';
    contadorWilson = 0;
}

function fecharWilson() {
    document.getElementById('modal-wilson').style.display = 'none';
    renderizarPergunta();
}

function finalizarTeste() {
    document.getElementById('tela-teste').style.display = 'none';
    document.getElementById('tela-resultado').style.display = 'block';
    
    document.getElementById('res-titulo').innerText = testeAtual.titulo;
    
    // Lógica de Devolutiva Ouro (Simplificada para o motor)
    let feedback = "";
    if (typeof testeAtual.devolutiva === 'string') {
        feedback = testeAtual.devolutiva;
    } else {
        // Se for lógica de pontuação
        const soma = respostasUsuario.reduce((a, b) => a + b, 0);
        feedback = `Sua pontuação: ${soma}. \n\nWilson diz: Você completou o teste com sucesso! Analise seus padrões e use este conhecimento para sua próxima grande virada.`;
    }
    
    document.getElementById('res-conteudo').innerText = feedback;
}

function mostrarAvisoPremium() {
    document.getElementById('wilson-titulo').innerText = "Conteúdo Premium 🔒";
    document.getElementById('wilson-frase').innerHTML = "Este teste faz parte do pacote avançado. Desbloqueie os 50 testes e a mentoria completa agora!<br><a href='#' class='btn-premium'>Quero ser Premium</a>";
    document.getElementById('modal-wilson').style.display = 'flex';
}

function falarLiw() {
    const falas = ["Bora evoluir?", "Tô de olho em você!", "O Wilson é bravo, mas ajuda!", "Já bebeu água hoje?", "Foco no teste!"];
    const balao = document.getElementById('liw-balao');
    balao.innerText = falas[Math.floor(Math.random() * falas.length)];
    balao.style.display = 'block';
    setTimeout(() => balao.style.display = 'none', 3000);
}

// Iniciar
window.onload = carregarPainel;
</script>
</body>
</html>
